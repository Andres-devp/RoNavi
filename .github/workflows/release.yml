name: release

# Publishing a version: bump ronavi/__init__.py __version__, add its CHANGELOG.md section,
# commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`. This workflow checks and releases it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches ronavi.__version__ and has CHANGELOG notes
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Install RoNavi Studio dependencies
        run: python -m pip install -r ronavi/requirements.txt

      - name: Same checks as validate
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
        run: python scripts/validate.py --strict

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "RoNavi Studio $GITHUB_REF_NAME" --notes-file notes.md
